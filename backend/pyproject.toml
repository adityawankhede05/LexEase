[project]
name = "lexease-backend"
version = "0.1.0"
description = "FastAPI backend for LexEase legal simplification tool"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
